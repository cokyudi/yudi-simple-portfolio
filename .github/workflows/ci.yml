name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version; keep .nvmrc and
          # package.json engines in step.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm test

      # No build step here on purpose: Vercel builds every push and PR, and
      # `next build` typechecks as it goes. Duplicating it would only add the
      # slowest step and the one that fails for environmental reasons —
      # app/og/* fetches Google Fonts at build time. This job covers what
      # Vercel does not: lint and tests.
