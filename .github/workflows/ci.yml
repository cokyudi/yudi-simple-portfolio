name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm test

      # Runs last: it is the slowest step and the one most likely to fail for
      # environmental reasons (app/og/* fetches fonts at build time).
      - run: npm run build
        env:
          # The assistant is inert without a key; the build only needs to
          # compile the route, not call Gemini.
          GOOGLE_GENERATIVE_AI_API_KEY: ''
